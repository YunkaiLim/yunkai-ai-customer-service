<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yunkai AI Customer Service</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;background:#f7f7f8;color:#111}
    .card{background:white;border:1px solid #ddd;border-radius:16px;padding:20px;box-shadow:0 4px 20px #0000000d}
    #log{min-height:320px;max-height:56vh;overflow:auto;padding:8px 0}
    .m{padding:10px 12px;border-radius:12px;margin:8px 0;white-space:pre-wrap}.u{background:#eef3ff;margin-left:15%}.a{background:#f2f2f2;margin-right:15%}
    form{display:flex;gap:8px;margin-top:16px}input{flex:1;padding:12px;border:1px solid #bbb;border-radius:10px}button{padding:10px 16px;border:0;border-radius:10px;background:#111;color:white;cursor:pointer}
    small{color:#666}.status{margin:8px 0 16px;padding:8px 10px;border-radius:10px;background:#fafafa;border:1px solid #eee}
  </style>
</head>
<body>
<div class="card">
  <h2>Yunkai AI Customer Service · Local Demo</h2>
  <small>High-risk or sensitive requests are escalated for human review; this demo does not execute account or payment actions.</small>
  <div class="status" id="status">Checking service…</div>
  <div id="log"></div>
  <form id="f">
    <input id="q" autocomplete="off" placeholder="Ask about an approved policy…" />
    <button>Send</button>
  </form>
</div>
<script>
const log=document.querySelector('#log'), q=document.querySelector('#q'), status=document.querySelector('#status');
function add(text,cls){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight}
async function health(){try{const r=await fetch('/health');const h=await r.json();status.textContent='Service ready · knowledge chunks '+h.knowledge_chunks+' · Chatwoot '+(h.chatwoot_ready?'configured':'not configured')}catch(e){status.textContent='Service status unavailable'}}
health();
document.querySelector('#f').onsubmit=async(e)=>{e.preventDefault();const m=q.value.trim();if(!m)return;add(m,'u');q.value='';
 try{const r=await fetch('/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:m,conversation_id:'web-demo'})});const j=await r.json();add(j.reply+(j.handoff?'\n[Human review: '+(j.reason||'review')+']':''),'a')}catch(err){add('Request failed: '+err,'a')}};
</script>
</body>
</html>
